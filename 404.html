<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Preloader -->
  <div class="preloader">
    <div class="preloader-spinner"></div>
  </div>

  <div class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h2>Page Not Found</h2>
      <p>Oops! The page you're looking for seems to have been demolished. Let's get you back to building.</p>

      <div class="error-buttons">
        <a href="index.html" class="btn btn-primary">Go to Homepage</a>
        <a href="javascript:history.back()" class="btn btn-outline" style="border-color:rgba(255,255,255,0.3);color:#fff;">Go Back</a>
      </div>

      <div class="error-illustration">
        <span class="error-tools">🔨</span>
        <span class="error-tools">🪛</span>
        <span class="error-tools">⚒️</span>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
